name: gazette-mdja

x-airflow-common: &airflow-common
  image: gazette-mdja-airflow:3.3.2
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/passwords.json
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Paris
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Run bin/dev.ps1 first}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?Run bin/dev.ps1 first}@postgres/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Run bin/dev.ps1 first}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    PYTHONPATH: /opt/airflow/src
    GAZETTE_ROOT: /opt/airflow
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./src:/opt/airflow/src:ro
    - ./sources.csv:/opt/airflow/sources.csv:ro
    - ./plugins:/opt/airflow/plugins:ro
    - ./logs:/opt/airflow/logs
    - ./data:/opt/airflow/data
    - ./articles_bruts:/opt/airflow/articles_bruts
    - airflow-auth:/opt/airflow/auth

services:
  app:
    image: gazette-mdja-app:local
    build:
      context: .
      target: app
    user: "${AIRFLOW_UID:-50000}:0"
    environment:
      PYTHONPATH: /app/src
      GAZETTE_DATABASE_URL: postgresql://airflow:${POSTGRES_PASSWORD:?Run bin/dev.ps1 first}@postgres/gazette
    volumes:
      - ./sources.csv:/app/sources.csv:ro
      - ./data:/app/data
      - ./articles_bruts:/app/articles_bruts
      - ./tests/fixtures:/app/fixtures:ro
    command: ["--source", "lemonde"]
    profiles: [collect]

  gazette-init:
    image: gazette-mdja-app:local
    user: "${AIRFLOW_UID:-50000}:0"
    entrypoint: ["python", "-m", "gazette.storage"]
    command: ["--init"]
    environment:
      GAZETTE_DATABASE_URL: postgresql://airflow:${POSTGRES_PASSWORD:?Run bin/dev.ps1 first}@postgres/gazette
      GAZETTE_ADMIN_DATABASE_URL: postgresql://airflow:${POSTGRES_PASSWORD:?Run bin/dev.ps1 first}@postgres/postgres
    volumes:
      - ./sources.csv:/app/sources.csv:ro
    depends_on:
      postgres:
        condition: service_healthy

  storage-tests:
    image: gazette-mdja-test:local
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql://airflow:${POSTGRES_PASSWORD:?Run bin/dev.ps1 first}@postgres/gazette
    depends_on:
      gazette-init:
        condition: service_completed_successfully
    profiles: [test]

  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run bin/dev.ps1 first}
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    build:
      context: .
      dockerfile: infra/airflow/Dockerfile
    command: db migrate
    depends_on:
      postgres:
        condition: service_healthy

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8081}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres-data:
  airflow-auth:
