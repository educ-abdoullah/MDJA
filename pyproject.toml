[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gazette-mdja"
version = "0.1.0"
description = "Collecte RSS quotidienne orchestree par Apache Airflow"
requires-python = ">=3.12"
dependencies = ["feedparser==6.0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
