[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gazette-mdja"
version = "0.1.0"
description = "Collecte RSS quotidienne orchestree par Apache Airflow"
requires-python = ">=3.12"
dependencies = ["feedparser==6.0.11", "psycopg2-binary==2.9.13"]

[project.optional-dependencies]
ml = [
    "numpy==2.5.3", "scikit-learn==1.9.1", "PyYAML==6.0.3",
    "onnxruntime==1.31.1", "tokenizers==0.23.2", "huggingface-hub==1.31.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
