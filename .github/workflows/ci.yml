name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
  tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start local stack
        env:
          GAZETTE_SKIP_COLLECT: '1'
        run: sh bin/dev
      - name: Validate actual Airflow DAG import
        run: >-
          docker compose exec -T airflow-dag-processor python -c
          "from airflow.models import DagBag;
          bag = DagBag('/opt/airflow/dags');
          assert not bag.import_errors, bag.import_errors;
          dag = bag.dags['gazette_daily'];
          assert len(dag.tasks) == 2;
          assert dag.max_active_runs == 1"
      - name: Check application runs as non-root
        run: >-
          docker run --rm --entrypoint python gazette-mdja-app:local -c
          "import os; assert os.getuid() != 0; from gazette.collectors.rss import load_sources;
          from pathlib import Path; assert len(load_sources(Path('sources.csv'))) == 1"
      - name: Save the verified image
        run: docker save gazette-mdja-app:local -o /tmp/gazette-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: application-image
          path: /tmp/gazette-image.tar
          retention-days: 1
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 150
      - name: Stop services
        if: always()
        run: docker compose down

  push:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: application-image
          path: /tmp
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the same image with timestamp and SHA
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          tag="$(date -u +%Y%m%dT%H%M%SZ)-${REVISION:0:12}"
          docker load -i /tmp/gazette-image.tar
          docker tag gazette-mdja-app:local "$image:$tag"
          docker tag gazette-mdja-app:local "$image:sha-$REVISION"
          docker push "$image:$tag"
          docker push "$image:sha-$REVISION"
          printf 'Image: `%s:%s`\nCommit: `%s`\n' "$image" "$tag" "$REVISION" >> "$GITHUB_STEP_SUMMARY"
